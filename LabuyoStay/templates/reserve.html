
{% extends "base.html" %}

{% block content %}

<h1>Boarding House Reservation</h1>

<div class="house-card">

    <h2>{{ house.name }}</h2>

    <p>{{ house.address }}</p>

    <h3>₱{{ "%.2f"|format(house.price) }}/month</h3>

    <form method="POST"
          action="{{ url_for('submit_reservation',
                             house_id=house.id) }}">

        <label>Full Name</label>

        <input type="text"
               name="tenant_name"
               placeholder="Enter your full name"
               required>

        <label>Contact Number</label>

        <input type="text"
               name="contact"
               placeholder="Enter contact number"
               required>

        <label>Reservation Date</label>

        <input type="date"
               name="reservation_date"
               required>

        <button type="submit">
            Submit Reservation
        </button>

    </form>

</div>

{% endblock %}
